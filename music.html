<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sites Direct Audio Fix</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
        }
        .music-btn {
            background-color: #111111; /* Change color to fit your site */
            color: #ffffff;
            font-family: sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .music-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Simple click button -->
    <button class="music-btn" id="triggerBtn" onclick="playDirectAudio()">‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ </button>

    <!-- Standard HTML5 Audio element - Google Sites CANNOT block this via button click -->
    <audio id="localAudio" loop>
        <source src="deltarune6.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playDirectAudio() {
            var audio = document.getElementById('localAudio');
            var button = document.getElementById('triggerBtn');

            // Plays directly in the GitHub context, bypassing the SoundCloud iframe lock
            audio.play().then(() => {
                button.textContent = "‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ";
                button.style.opacity = "0.5";
                button.style.pointerEvents = "none";
            }).catch(error => {
                console.log("Playback failed: ", error);
                button.textContent = "‎ ‎ ‎ oops‎ ‎ ‎ ";
            });
        }
    </script>

</body>
</html>
